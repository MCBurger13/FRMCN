<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al curso · [m].seny /academy</title>
    <meta name="description" content="Área de alumnos del curso IA Generativa de [m].seny /academy.">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/curso.css">
</head>
<body class="login">
    <div class="brand">
        <span class="wm"><span><b>[m]</b>.seny</span><span class="sub">/academy</span></span>
        <p class="eyebrow brackets"> Área de alumnos </p>
    </div>

    <form class="card-login" id="loginForm" novalidate>
        <div class="error" id="errorMsg" role="alert">[ ! ] Usuario o contraseña incorrectos.</div>
        <label>
            <span>Usuario</span>
            <input type="text" id="username" name="username" placeholder="Tu nombre de usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>
            <span>Contraseña</span>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn-accent" id="submitBtn">Entrar al curso <span aria-hidden="true">→</span></button>
    </form>

    <p class="note">Acceso exclusivo para alumnos matriculados.</p>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://ndtoqnpomhtubcygkwlh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TWDLiIP8n-EwF8ULmqDm0w_9uv5nBsS';
        const COOKIE = 'sb-ndtoqnpomhtubcygkwlh-auth-token';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');
        const idle = submitBtn.innerHTML;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando…';

            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const email = `${username}@cursoia.local`;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error || !data.session) {
                errorMsg.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.innerHTML = idle;
                return;
            }

            // Cookie legible por el Edge Middleware (Supabase guarda además la sesión en localStorage)
            const session = data.session;
            const cookieValue = encodeURIComponent(JSON.stringify({
                access_token: session.access_token,
                refresh_token: session.refresh_token,
                expires_at: session.expires_at
            }));
            const maxAge = 60 * 60 * 24 * 7; // 7 días
            document.cookie = `${COOKIE}=${cookieValue};path=/;max-age=${maxAge};SameSite=Lax`;

            window.location.href = '/index.html';
        });
    </script>
</body>
</html>
