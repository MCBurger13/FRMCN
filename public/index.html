<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso IA Generativa · [m].seny /academy</title>
    <meta name="description" content="Panel de alumno del curso IA Generativa de [m].seny /academy: progreso, temario y acceso a las clases.">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/curso.css">
</head>
<body class="home" data-page="home">
    <div id="home">
        <aside id="rail">
            <a class="wm" href="/index.html"><span><b>[m]</b>.seny</span><span class="sub">/academy</span></a>
            <div>
                <p id="prog-label">Tu progreso</p>
                <p id="prog-num" class="display"><span id="prog-n">0</span><small> /<span id="prog-total">0</span> publicadas</small></p>
                <span class="track"><i id="prog-fill"></i></span>
                <p id="prog-pct">0% DEL CURSO PUBLICADO</p>
            </div>
            <nav id="rail-nav" aria-label="Módulos"></nav>
            <p class="level"></p>
            <a href="/login.html" class="link-live salir" data-logout>Salir →</a>
        </aside>

        <main id="main">
            <p class="eyebrow brackets-ink"> Hola, <span id="alumno">alumno</span> </p>
            <h1 class="display" id="headline">Sigue donde lo dejaste.</h1>

            <div id="continue">
                <div>
                    <p class="k" id="cont-k"></p>
                    <h2 class="display" id="cont-title"></h2>
                    <p id="cont-sub"></p>
                </div>
                <a href="#" class="btn-accent" id="cont-cta">Continuar <span aria-hidden="true">→</span></a>
            </div>

            <section id="temario" aria-labelledby="temario-title">
                <div class="sec-head-home">
                    <p class="eyebrow brackets-ink" id="temario-title"> Temario </p>
                    <span class="count" id="temario-count"></span>
                </div>
                <div id="mods"></div>
            </section>
        </main>
    </div>

    <script src="/curso-data.js"></script>
    <script src="/curso.js"></script>
</body>
</html>
